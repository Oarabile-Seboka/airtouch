<svg xmlns="http://www.w3.org/2000/svg" viewBox="230 130 330 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan to Apple Blue Gradient -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38d6c4"/>
      <stop offset="40%" stop-color="#2997ff"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Concentric Circular Waves above Fingertip (Center: 363, 256) -->
  <circle cx="363" cy="256" r="42" stroke="url(#handGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.95"/>
  <circle cx="363" cy="256" r="72" stroke="url(#handGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="12 8" opacity="0.75"/>
  <circle cx="363" cy="256" r="106" stroke="url(#handGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Subtle Horizontal Horizon Waves (Touch Plane) -->
  <line x1="235" y1="256" x2="295" y2="256" stroke="#38d6c4" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="431" y1="256" x2="491" y2="256" stroke="#38d6c4" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Glowing Touch Point Spark -->
  <circle cx="363" cy="256" r="9" fill="#ffffff" filter="url(#coreGlow)"/>
  <circle cx="363" cy="256" r="4" fill="#38d6c4"/>

  <!-- Hand Vector (Matching the Reference Icon) -->
  <path d="M 360 231 L 345 237 L 336 248 L 334 254 L 333 379 L 331 377 L 330 368 L 326 359 L 318 351 L 305 346 L 297 346 L 284 351 L 276 359 L 272 368 L 272 384 L 293 506 L 301 533 L 311 552 L 319 563 L 341 584 L 364 597 L 386 604 L 402 606 L 432 604 L 460 595 L 473 588 L 488 577 L 506 558 L 522 530 L 530 499 L 530 373 L 525 362 L 518 355 L 512 352 L 496 350 L 485 355 L 479 342 L 467 332 L 461 330 L 449 330 L 438 333 L 431 319 L 419 311 L 403 310 L 394 314 L 393 258 L 391 250 L 388 244 L 380 236 L 371 232 Z M 358 245 L 372 247 L 379 256 L 380 408 L 382 410 L 389 411 L 393 406 L 393 335 L 401 325 L 406 323 L 417 325 L 425 335 L 425 406 L 429 411 L 436 410 L 439 405 L 439 355 L 449 344 L 457 343 L 464 346 L 471 356 L 471 427 L 476 432 L 483 430 L 485 425 L 484 379 L 486 372 L 493 365 L 506 364 L 514 370 L 517 376 L 517 495 L 509 526 L 496 549 L 474 571 L 456 582 L 429 591 L 390 591 L 370 585 L 349 573 L 329 554 L 314 529 L 307 508 L 285 371 L 296 360 L 306 360 L 315 367 L 333 458 L 337 464 L 343 464 L 347 459 L 347 257 L 350 251 Z" fill="url(#handGrad)" fill-rule="evenodd"/>
